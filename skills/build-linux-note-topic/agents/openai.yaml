interface:
  display_name: "技术书籍与专题 / Technical topics"
  short_description: "技术教材编写与审查 / Write and review technical books"
  default_prompt: "使用 $build-linux-note-topic 按读者认识的变化设计专题，用完整样章校准讲解，再以贯穿实例、自然语气、适量幽默、实验与渐进练习完成有证据、可迁移的连续教材。 Use $build-linux-note-topic to develop a coherent, evidence-based technical topic in the requested language."
